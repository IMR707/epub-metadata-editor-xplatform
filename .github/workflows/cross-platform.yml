name: Cross-platform prototype

on:
  push:
    branches: [master, port/cross-platform, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore pinned dependencies
        run: dotnet restore EpubMetadataEditor.XPlatform.slnx --locked-mode
      - name: Build
        run: dotnet build EpubMetadataEditor.XPlatform.slnx --configuration Release --no-restore --warnaserror
      - name: Core, CLI, and headless UI tests
        run: dotnet test EpubMetadataEditor.XPlatform.slnx --configuration Release --no-build --no-restore
      - name: CLI smoke check
        run: dotnet run --project src/EpubMetadataEditor.Cli --configuration Release --no-build -- inspect fixtures/epub3-unicode.epub
